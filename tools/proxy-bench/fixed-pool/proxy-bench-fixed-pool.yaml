# Copy and edit this example for each run. Input PVC contains metadata only:
# dataset-manifest.json, plan/, target-config.yaml, proxy-rules.json,
# target-preparation.json and target-object-results.json (preserve relative refs).
apiVersion: batch/v1
kind: Job
metadata:
  name: proxy-bench-fixed-pool-run-001
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # Build tools/proxy-bench/Dockerfile, then pin the resulting digest.
          image: dragonflyoss/proxy-bench:replace-with-built-digest
          command: ["/bin/sh", "/home/k6/fixed-pool/run-benchmark.sh"]
          env:
            - name: MANIFEST
              value: /inputs/dataset-manifest.json
            - name: PLAN
              value: /inputs/plan/request-plan.json
            - name: TARGET_PREPARATION
              value: /inputs/target-preparation.json
            - name: TARGET_CONFIG
              value: /inputs/target-config.yaml
            - name: HTTP_PROXY
              value: http://seed.example:4001
            - name: RATE
              value: "100"
            - name: DURATION
              value: "300s"
            - name: RUN_ID
              value: run-001
            - name: WORKER_ID
              value: "0"
            - name: RESULT_DIR
              value: /results
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: inputs
              mountPath: /inputs
              readOnly: true
            - name: results
              mountPath: /results
      volumes:
        - name: inputs
          persistentVolumeClaim:
            claimName: fixed-pool-inputs
            readOnly: true
        - name: results
          emptyDir: {}
