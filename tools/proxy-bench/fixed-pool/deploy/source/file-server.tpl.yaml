apiVersion: v1
kind: Service
metadata:
  name: ${SOURCE_NAME}
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: proxy-bench-fixed-pool-source
    app.kubernetes.io/instance: ${SOURCE_NAME}
    component: file-server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${SOURCE_NAME}
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  serviceName: ${SOURCE_NAME}
  selector:
    matchLabels:
      app.kubernetes.io/name: proxy-bench-fixed-pool-source
      app.kubernetes.io/instance: ${SOURCE_NAME}
      component: file-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxy-bench-fixed-pool-source
        app.kubernetes.io/instance: ${SOURCE_NAME}
        component: file-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${SOURCE_NODE}
      securityContext:
        fsGroup: ${FS_GROUP}
      containers:
        - name: file-server
          image: ${FILE_SERVER_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: "${SERVER_CPU_REQUEST}"
              memory: "${SERVER_MEMORY_REQUEST}"
            limits:
              cpu: "${SERVER_CPU_LIMIT}"
              memory: "${SERVER_MEMORY_LIMIT}"
          volumeMounts:
            - name: source
              mountPath: /usr/share/nginx/html/objects
              subPath: dataset/objects
              readOnly: true
            - name: source
              mountPath: /fixed-pool-data
              subPath: dataset
              readOnly: true
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: ${PVC_NAME}
