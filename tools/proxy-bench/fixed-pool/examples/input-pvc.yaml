# Operator-only transfer helper. It is never created by a benchmark worker.
# Choose a suitable StorageClass/capacity and replace the helper image with a
# digest available to the cluster (it must provide sleep and tar).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fixed-pool-inputs
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: fixed-pool-input-loader
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: alpine:3.22
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: inputs
          mountPath: /data
  volumes:
    - name: inputs
      persistentVolumeClaim:
        claimName: fixed-pool-inputs
